[[criterion]]
id = "AC12"
mode = "command"
text = "Pasan las pruebas de los ocho paquetes tocados: migraciones, store (columna en la misma transaccion), formato de archivo (identidad byte a byte y esquema en 1), servicio (las tres transiciones que graban, las que no, los tres casos del extremo entregado y el calculo del rango), MCP (campo aditivo del sobre), linea de comandos (lo que se imprime), capa 1 (anclas de la seccion bounded-review) e instalador (manuales)."
command = ["go", "test", "-count=1", "./internal/db/...", "./internal/store/...", "./internal/sddfile/...", "./internal/service/...", "./internal/mcp/...", "./internal/cli/...", "./internal/subagents/...", "./internal/install/..."]
timeout = "1800s"

[[criterion]]
id = "AC13"
mode = "manual"
text = "NADA de esto bloquea. Con repoDir vacio, con git fallando, con el HEAD movido durante la revision o con la entrada de revision sin extremo registrado, TODA transicion se completa igual y spec_advance devuelve la spec avanzada y la resolucion de ejecutor con normalidad. Es la restriccion que gobierna la ficha entera."
evidence_required = "Lectura de frontierForTransition, appendFrontierNote y ReviewRange confirmando que ninguna devuelve error (solo valor), mas el nombre de la prueba que avanza desde qa con el repositorio no disponible y espera exito, mas la comprobacion de que el calculo del rango en el manejador MCP es best-effort igual que la lectura del manifiesto de subagentes."

[[criterion]]
id = "AC14"
mode = "manual"
text = "La ampliacion D2c se comporta como dice el diseño en sus TRES casos: (a) HEAD igual al extremo entregado -> la frontera es ese extremo y la razon queda exactamente como quedaria hoy, sin anexar nada; (b) HEAD distinto -> la frontera sigue siendo el extremo entregado, NUNCA el HEAD, y la razon declara los dos SHA; (c) la entrada vigente sin extremo -> la columna queda VACIA y la razon explica por que, sin inventar HEAD."
evidence_required = "Los tres casos ejecutados sobre un repositorio real, con el valor observado de la columna y el texto exacto de la razon en cada uno. Para (b), el commit intercalado y la comprobacion de que el rango de la pasada SIGUIENTE cubre ese commit (no se pierde nadie)."

[[criterion]]
id = "AC15"
mode = "manual"
text = "El conjunto de transiciones que graban es exactamente el trio declarado (implementing -> qa, qa -> done, qa -> implementing) y las excluidas quedan vacias: qa -> needs_grill (pushback, no hay informe), done -> implementing (rechazo posterior al cierre) y el par del carril trivial. Y el significado de la columna se distingue por el par de estados de su propia fila, no por su valor."
evidence_required = "La tabla del conjunto cerrado comprobada fila por fila contra la prueba que la recorre, nombrando la prueba y el valor observado de la columna en cada transicion excluida, mas la salida de `mneme spec history` mostrando que dice cual de los dos extremos es en cada fila."

[[criterion]]
id = "AC16"
mode = "manual"
text = "Los cuatro estados del rango se producen de verdad, con To leido de la fila de entrada y no recalculado, y su frase en claro los dice con palabras: primera pasada (desde el commit base), segunda pasada (desde la frontera), frontera perdida por historia reescrita (nombrando el SHA muerto y volviendo al commit base), y rango vacio (nada nuevo desde la frontera). Y las tres causas de rango no disponible producen su texto."
evidence_required = "Los cuatro estados mas las tres causas de indisponibilidad, ejecutados —incluido un rebase o aplastado de commits real que invalide la frontera— con el JSON devuelto y la frase exacta que se imprime en cada uno. Para To: un commit posterior a la entrada en qa que demuestre que To no se movio."

[[criterion]]
id = "AC17"
mode = "manual"
text = "La nota de frontera se anexa DESPUES de lo que SPEC-156 compone en la razon de un rechazo, y no lo reordena ni lo reescribe. Orden: razon humana -> hallazgos -> frontera."
evidence_required = "El texto completo de la razon de un rechazo que lleve a la vez hallazgos y nota de frontera, con los tres bloques en ese orden."

[[criterion]]
id = "AC18"
mode = "assert"
text = "Lo que ve una persona en la linea de comandos (AC19 de la spec) tiene prueba propia: spec advance imprime el aviso del rango al entrar en qa y la nota de frontera al salir, spec reject imprime la nota, y spec history dice cual de los dos extremos es cada SHA. AC12 la ejecuta."

  [[criterion.assert]]
  verb = "pattern_count"
  contains = "func TestSpecCLI_FrontierOutput(t *testing.T)"
  in = ["internal/cli/*_test.go"]
  word = false
  comparator = ">="
  count = 1
  new = false
