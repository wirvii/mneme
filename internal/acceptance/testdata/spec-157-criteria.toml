schema_version = 1

# SPEC-157 — criterios ejecutables.
#
# Incluye la ampliacion aprobada por el owner (D2b/D2c): la columna se rellena
# tambien en la transicion de ENTRADA a revision, con el extremo entregado, y al
# salir la frontera se COPIA de ahi en vez de recalcularse de HEAD.
#
# Dogfooding deliberado: SPEC-156 hace obligatorio este archivo en carril
# standard, asi que su hermana tambien lo trae.
#
# Por que algunos criterios NO caben en modo assert (documentado en spec.md §4):
#  - "MinFileSchema y CurrentFileSchema siguen valiendo 1" (AC12 de la spec) es la
#    PRESERVACION de un invariante: un assert sobre algo que ya se cumple en el
#    commit base sale `vacuous` por construccion. Lo cubre el criterio en modo
#    command, que ejecuta la prueba que fija ese par exacto.
#  - "ninguna ruta de codigo devuelve un error porque la frontera no se pudo
#    calcular, ni porque el HEAD se movio" es una propiedad NEGATIVA sobre rutas
#    de ejecucion. Ningun verbo que lee el arbol de git puede demostrar una
#    ausencia asi. Va en manual.
#  - "la frontera se COPIA del extremo entregado en vez de recalcularse" es una
#    propiedad del comportamiento en el tiempo (exige un commit intercalado entre
#    la entrada y la salida de revision). Los verbos assert solo leen contenido:
#    lo que SI se puede asertar es que existe la prueba que lo ejerce (AC5), y la
#    prueba misma la ejecuta el criterio en modo command.
#
# REVISION DEL PLAN (2026-09-24, contra main @ a9a2f02, tras SPEC-156). Examen
# contra el catalogo de formas de criterio muerto. Cambios, todos de medicion —
# ninguno cambia el alcance aprobado de la spec:
#  - AC3/AC4: `symbol_referenced` se satisfacia con CUALQUIER mencion fuera de
#    sdd_frontier.go, incluido CLAUDE.md o docs/*.md, que estan en el alcance y
#    van a nombrar la funcion (septima forma: sustituto que hoy coincide). Ahora
#    se mide la LLAMADA en el sitio que D2 fija: el envoltorio de sdd_export.go.
#  - AC5/AC7/AC8: buscar el NOMBRE de un test lo satisface un comentario que lo
#    cite (septima forma). Se busca la DECLARACION `func TestX(t *testing.T)`,
#    que un comentario no escribe; AC12 (command) la ejecuta.
#  - AC7: "ReviewedSHA en >= 3 lineas de format.go" no demostraba que
#    equalSpecRecord comparase el campo (render y parseo ya suman lineas). Se
#    sustituye por la existencia de la prueba que detecta esa diferencia.
#  - AC8: "ReviewedSHA en algun test de sddfile" lo satisfacia cualquier prueba
#    de ida y vuelta, no la de identidad byte a byte que el criterio dice medir.
#  - AC6: `IsAncestor` como palabra lo satisface un comentario; se mide la llamada.
#  - AC11: "frontera" YA EXISTIA en agent-fixed.md en el commit base (seccion
#    criteria-contract de SPEC-156: "la frontera de un rechazo", "frontera
#    medible") — asercion muerta. "rango" en los manuales exigia ESPANOL en dos
#    documentos escritos en INGLES (forma: literal en el idioma equivocado); y
#    `>= 2` sumado sobre los dos manuales lo cumplia uno solo. Ahora: una
#    asercion por manual con el nombre del campo que el orquestador copia
#    (`review_range`), y dos frases nuevas de la capa 1. Se anade
#    docs/sdd-git-native.md, que AC20 de la spec nombra y el criterio omitia.
#  - AC10: se anade la existencia de la prueba MCP del campo aditivo (AC17 de la
#    spec: JSON identico fuera de qa), que ningun criterio medía.
#  - AC12: la orden no ejecutaba los paquetes cli, subagents e install, donde
#    viven las pruebas de AC19 (salida de la linea de comandos), de la capa 1 y
#    de los manuales. Se anaden; timeout ampliado.
#  - AC18 (nuevo): AC19 de la spec (lo que imprime la linea de comandos) no
#    tenia ningun criterio. Mide la existencia de su prueba.
#
# AMPLIACION APROBADA POR EL OWNER (2026-09-24, Q2 del plan): internal/mcp/tools.go
# entra en el alcance para que la descripcion de la herramienta spec_advance
# diga que devuelve {spec, executor, review_range}. AC10 gana una asercion:
# `review_range` en tools.go (0 lineas en el commit base, asi que no es vacua).
# Q1 (una mneme anterior borra reviewed_sha al reescribir; CurrentFileSchema NO
# sube) no necesita criterio propio: la correccion de docs/sdd-git-native.md la
# cubre la asercion de AC11 sobre ese archivo, y el esquema en 1 lo ejecuta AC12.

[[criterion]]
id = "AC1"
mode = "assert"
text = "La migracion 022 existe y añade la columna de SHA a spec_history. UNA sola columna y UNA sola migracion cubren los dos extremos (el entregado y el revisado)."

  [[criterion.assert]]
  verb = "file_exists"
  path = "internal/db/migrations/022_spec_history_reviewed_sha.sql"
  new = true

  [[criterion.assert]]
  verb = "pattern_count"
  contains = "reviewed_sha"
  in = ["internal/db/migrations/022_spec_history_reviewed_sha.sql"]
  word = true
  comparator = ">="
  count = 1
  new = true

