# .mneme/quality.toml — constitución de calidad de este repositorio.
# Versionada y revisable en PR: la calidad es parte del código.
# mneme NO tiene valores por defecto para nada de este fichero.
#
# enabled=false a propósito (SPEC-115 R4/P13, reafirmado en SPEC-116 D16,
# SPEC-117 D16 y SPEC-118 D20): encender el mecanismo — gates, cobertura/
# cliquet, criterios o presupuesto — antes de que S5/S6 estén implementadas,
# o antes de que el owner lo decida explícitamente, es una decisión fuera
# del alcance de esta spec. ATENCIÓN (SPEC-118 D12): encender [budget]
# activa TAMBIÉN el certificado para la lane TRIVIAL — a partir de ahí
# `mneme lane audit` exige certificado. Ver docs/quality.md y docs/lanes.md.

schema_version = 4

# El interruptor. Mientras sea false el mecanismo NO bloquea nada.
enabled = false

[execution]
# Bytes de la cola de salida que se guardan por gate (1..65536).
output_tail_bytes = 4096

[[gate]]
name = "build"
command = ["make", "build"]
timeout = "5m"
required = true

[[gate]]
name = "test"
command = ["make", "test"]
timeout = "20m"
required = true

[[gate]]
# No "make lint": ese target no existe en el Makefile de este repo
# (verificado, V10 del diseño de SPEC-115).
name = "lint"
command = ["golangci-lint", "run"]
timeout = "5m"
required = true

[coverage]
# SPEC-116 (EPIC-calidad S2): la cobertura de las lineas cambiadas por una
# spec. Apagado a proposito — encenderlo es una decision posterior del
# owner, la misma postura de D16.
enabled = false

# go-cover: el perfil nativo de `go test -coverprofile`, sin conversion.
format = "go-cover"

# El comando real de este repositorio — declarado y ya funcional, aunque el
# mecanismo este apagado.
command = ["make", "coverage"]

# Donde `make coverage` deja el perfil (Makefile). Ignorado tres veces por
# .gitignore (*.out, coverage.*, tmp/) — requisito de D12.
profile_path = "tmp/coverage.out"

timeout = "20m"

# 80 y no 100: codigo de arranque y rutas de error hacen que 100 sea
# irreal y entrena a bajar el numero (D13 del grill).
min_diff_line_pct = 80.0

# Por debajo de este numero de lineas elegibles la comprobacion se salta —
# ver docs/quality.md para la aritmetica que fija este suelo.
min_changed_lines = 5

exclude = []

[ratchet]
# El cliquet: la cobertura global de este repositorio no puede caer sin
# firma. Requiere [coverage].enabled = true — sigue apagado aqui.
enabled = false

# Caida tolerada, en puntos porcentuales, respecto a la linea base.
max_global_line_pct_drop = 0.0

# Cuanto puede la medicion superar la marca antes de declararla obsoleta
# (D17). Debe ser >= max_global_line_pct_drop.
max_baseline_staleness_pct = 1.0

# NO se commitea .mneme/quality-baseline.toml: no hay medicion registrada
# todavia, y un fichero con cifras inventadas seria el peor arranque
# posible para un mecanismo que existe para que nadie teclee cifras (D16).

[criteria]
# SPEC-117 (EPIC-calidad S3): los criterios de aceptacion ejecutables.
# Apagado a proposito, misma postura que D16 de S2.
enabled = false

# Cota de la fase estructurada completa (git ls-tree + git grep sobre los
# dos refs). No cubre los criterios `command`: cada uno declara el suyo.
timeout = "5m"

# Cupo de criterios MANUALES, en porcentaje del total declarado. Superarlo
# hace FALLAR el certificado: el problema ya no es la verificacion, es que
# los criterios estan mal escritos (D14 del grill).
# Aritmetica con N pequeno: con 4 criterios, 25.0 permite exactamente 1.
max_manual_pct = 25.0

# Cupo de criterios que usan la ESCOTILLA de comando libre. Existe por el
# mismo motivo: sin el, la escotilla se traga el vocabulario cerrado.
max_command_pct = 30.0

[budget]
# SPEC-118 (EPIC-calidad S4): el presupuesto contra el grafo y la absorcion
# de lane audit. Apagado a proposito, misma postura que D16 de S2/S3.
# Encenderlo activa TAMBIEN el certificado para la lane TRIVIAL (D12).
enabled = false

# Cota de la fase de presupuesto completa: lectura de blobs, extraccion de
# simbolos y consultas al grafo. NO ejecuta ningun comando de este proyecto.
timeout = "2m"

# Los ficheros que NO cuentan contra el presupuesto y que SI cuentan como
# "llamador de test" para la deteccion solo-tests. UNA sola lista para las
# dos cosas (D6.2).
test_globs = ["**/*_test.go"]

# Cuantos saltos de indireccion se aceptan como "un test lo alcanza".
# 1 = solo llamada directa desde un test.
test_reach_depth = 3
