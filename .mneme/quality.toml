# .mneme/quality.toml — constitución de calidad de este repositorio.
# Versionada y revisable en PR: la calidad es parte del código.
# mneme NO tiene valores por defecto para nada de este fichero.
#
# enabled=false a propósito (SPEC-115 R4/P13, reafirmado en SPEC-116 D16,
# SPEC-117 D16, SPEC-118 D20, SPEC-119 D15 y SPEC-120 D15): encender el
# mecanismo — gates, cobertura/cliquet, criterios, presupuesto, mutación o
# verificación visual — antes de que el owner lo decida explícitamente, es
# una decisión fuera del alcance de esta spec. ATENCIÓN (SPEC-118 D12):
# encender [budget] activa TAMBIÉN el certificado para la lane TRIVIAL — a
# partir de ahí `mneme lane audit` exige certificado. Ver docs/quality.md
# y docs/lanes.md.
#
# [visual] queda declarada y APAGADA con targets = [] (SPEC-120 D15): este
# repositorio no tiene interfaz gráfica (tiene una TUI, internal/tui) y no
# hay pantalla real que declarar aquí. Encenderla sin objetivos sería
# inventarse verificación que nadie mide.
#
# SPEC-137 (etapa 1 de BL-221) aterrizó sin tocar NINGUNA clave de este
# fichero, ni el schema_version: solo cambió qué hace mneme con lo que ya
# declaraban las secciones de arriba (mutación y presupuesto pasan a medir
# en vez de bloquear; la cobertura del diff pasa a hallazgo firmable). Ver
# docs/quality.md, seccion "Etapa 1 del rediseño de la certificación".

schema_version = 6

# El interruptor. Mientras sea false el mecanismo NO bloquea nada.
enabled = false

[execution]
# Bytes de la cola de salida que se guardan por gate (1..65536).
output_tail_bytes = 4096

[[gate]]
name = "build"
command = ["make", "build"]
timeout = "5m"
required = true

[[gate]]
name = "test"
command = ["make", "test"]
timeout = "20m"
required = true

[[gate]]
# No "make lint": ese target no existe en el Makefile de este repo
# (verificado, V10 del diseño de SPEC-115).
name = "lint"
command = ["golangci-lint", "run"]
timeout = "5m"
required = true

[coverage]
# SPEC-116 (EPIC-calidad S2): la cobertura de las lineas cambiadas por una
# spec. Apagado a proposito — encenderlo es una decision posterior del
# owner, la misma postura de D16.
enabled = false

# go-cover: el perfil nativo de `go test -coverprofile`, sin conversion.
format = "go-cover"

# El comando real de este repositorio — declarado y ya funcional, aunque el
# mecanismo este apagado.
command = ["make", "coverage"]

# Donde `make coverage` deja el perfil (Makefile). Ignorado tres veces por
# .gitignore (*.out, coverage.*, tmp/) — requisito de D12.
profile_path = "tmp/coverage.out"

timeout = "20m"

# 80 y no 100: codigo de arranque y rutas de error hacen que 100 sea
# irreal y entrena a bajar el numero (D13 del grill).
min_diff_line_pct = 80.0

# Por debajo de este numero de lineas elegibles la comprobacion se salta —
# ver docs/quality.md para la aritmetica que fija este suelo.
min_changed_lines = 5

exclude = []

[ratchet]
# El cliquet: la cobertura global de este repositorio no puede caer sin
# firma. Requiere [coverage].enabled = true — sigue apagado aqui.
enabled = false

# Caida tolerada, en puntos porcentuales, respecto a la linea base.
max_global_line_pct_drop = 0.0

# Cuanto puede la medicion superar la marca antes de declararla obsoleta
# (D17). Debe ser >= max_global_line_pct_drop.
max_baseline_staleness_pct = 1.0

# NO se commitea .mneme/quality-baseline.toml: no hay medicion registrada
# todavia, y un fichero con cifras inventadas seria el peor arranque
# posible para un mecanismo que existe para que nadie teclee cifras (D16).

[criteria]
# SPEC-117 (EPIC-calidad S3): los criterios de aceptacion ejecutables.
# Apagado a proposito, misma postura que D16 de S2.
enabled = false

# Cota de la fase estructurada completa (git ls-tree + git grep sobre los
# dos refs). No cubre los criterios `command`: cada uno declara el suyo.
timeout = "5m"

# Cupo de criterios MANUALES, en porcentaje del total declarado. Superarlo
# hace FALLAR el certificado: el problema ya no es la verificacion, es que
# los criterios estan mal escritos (D14 del grill).
# Aritmetica con N pequeno: con 4 criterios, 25.0 permite exactamente 1.
max_manual_pct = 25.0

# Cupo de criterios que usan la ESCOTILLA de comando libre. Existe por el
# mismo motivo: sin el, la escotilla se traga el vocabulario cerrado.
max_command_pct = 30.0

[budget]
# SPEC-118 (EPIC-calidad S4): el presupuesto contra el grafo y la absorcion
# de lane audit. Apagado a proposito, misma postura que D16 de S2/S3.
# Encenderlo activa TAMBIEN el certificado para la lane TRIVIAL (D12).
enabled = false

# Cota de la fase de presupuesto completa: lectura de blobs, extraccion de
# simbolos y consultas al grafo. NO ejecuta ningun comando de este proyecto.
timeout = "2m"

# Los ficheros que NO cuentan contra el presupuesto y que SI cuentan como
# "llamador de test" para la deteccion solo-tests. UNA sola lista para las
# dos cosas (D6.2).
test_globs = ["**/*_test.go"]

# Cuantos saltos de indireccion se aceptan como "un test lo alcanza".
# 1 = solo llamada directa desde un test.
test_reach_depth = 3

[mutation]
# SPEC-119 (EPIC-calidad S5): la mutacion sobre el diff. Apagado a
# proposito, misma postura que D16 de S2/S3/S4 — encenderlo corre la
# suite completa UNA VEZ POR MUTANTE, la comprobacion mas cara del EPIC.
enabled = false

# gremlins (go-gremlins/gremlins) es un mutador de Go vivo. Su VOCABULARIO
# declara el estado NOT VIABLE (el mutante que no compilo), distinto de
# KILLED — el minimo que el registro de formatos exige (D1 pata b: PUEDE
# expresar la no viabilidad). PERO, verificado durante SPEC-119: en Go
# 1.26+, `go test` devuelve el MISMO exit code (1) tanto si un test falla
# como si el paquete no compila, asi que gremlins en la practica NUNCA
# reporta NOT VIABLE en este toolchain — un fallo de compilacion se
# clasifica como KILLED. Efecto real, sin suavizar: la puntuacion de
# mutacion puede venir INFLADA (no falsos rojos — falsa confianza), y el
# cupo de no-viables (max_not_viable_pct, mas abajo) no cazara ese caso
# concreto con gremlins hoy. Ver docs/quality.md (S5) y BL-178 (las
# salidas posibles para cerrar esta brecha). Declarado, nunca adivinado.
format = "gremlins"

# El target de este mismo Makefile. {{BASE_SHA}} se sustituye por la
# merge-base que mneme calcula — una OPTIMIZACION de coste (mneme reacota
# el informe por su cuenta, D3), nunca la frontera de correccion.
command = ["make", "mutation", "BASE={{BASE_SHA}}"]

# Donde `make mutation` deja el informe. Ignorado por .gitignore (tmp/).
report_path = "tmp/mutants.json"

# Presupuesto de la fase completa. Agotarlo NO es un fallo: es un hallazgo
# firmable por un humano, contado (D12) — y la salida, si se vuelve
# rutina, no es subir este numero (docs/quality.md).
timeout = "30m"

# Cupo ABSOLUTO de mutantes declarados equivalentes en un mismo
# certificado. Pasado el cupo, `mneme quality sign` se NIEGA (D9).
max_equivalent = 2

# Por encima de esta proporcion de mutantes NO VIABLES (los que ni
# siquiera compilan) el informe habla del mutador y no de los tests: es
# la comprobacion que impide el verde catastrofico de "todo no viable,
# cero supervivientes" (D1 pata d).
max_not_viable_pct = 25.0

[visual]
# SPEC-120 (S6): la verificacion visual declarativa. Apagado a proposito
# (D15): este repositorio no tiene interfaz grafica, asi que no hay nada
# real que declarar como objetivo visual. targets = [] es lo que la
# validacion condicional del schema permite -- encender esta seccion sin
# inventarse objetivos seria fabricar verificacion sobre nada.
enabled = false

# Formato del informe. Hoy solo "visual-v1". Declarado, nunca adivinado.
format = "visual-v1"

# El comando que levantaria la interfaz, la recorreria y dejaria el
# informe -- no aplica a este repositorio (D15), asi que no hay comando
# real que declarar. mneme lo ejecutaria tal cual, sin shell, y ESPERARIA
# a que termine: el ciclo de vida del servidor es del comando, nunca de
# mneme (D1).
command = ["true"]

# Donde el comando dejaria el informe, relativo a la raiz del repo. mneme
# LO BORRA antes de ejecutar: debe estar en .gitignore (verificado con
# git check-ignore -v: tmp/ ya cubre esta ruta).
report_path = "tmp/visual/report.json"

# Cota de la fase completa: arrancar, recorrer y apagar.
timeout = "15m"

# QUE se verifica. Identificadores OPACOS: mneme no interpreta ni un
# caracter. Vacio a proposito -- este repositorio no tiene pantallas que
# declarar (D15). Con enabled = true la lista vacia seria un ERROR.
targets = []

# true convierte cualquier console.error en fallo. Las excepciones no
# capturadas fallarian SIEMPRE, con independencia de esta clave.
fail_on_console_error = false

# Impactos de accesibilidad que harian fallar. Vocabulario cerrado:
# critical | serious | moderate | minor. Vacio = se mediria y registraria,
# pero no bloquearia.
a11y_fail_impacts = []

[visual.compare]
# El NIVEL 2: comparacion de pixeles contra referencias versionadas.
# Apagado a proposito -- sin interfaz grafica no hay capturas que comparar.
enabled = false

# Donde vivirian las referencias. VERSIONADO: mneme NUNCA escribe aqui
# (verificado con git check-ignore -v: esta ruta NO esta ignorada, a
# diferencia de tmp/).
reference_dir = ".mneme/visual/reference"

# Donde el comando dejaria las capturas. SALIDA: ignorado por git
# (verificado con git check-ignore -v: tmp/ ya cubre esta ruta).
capture_dir = "tmp/visual/captures"

# Tolerancia, en porcentaje de pixeles distintos. La comparacion es
# estricta: con la tolerancia justa, pasa.
max_diff_pct = 0.1
