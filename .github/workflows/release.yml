name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download pinned managed-speech catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIDE_VERSION=$(tr -d '[:space:]' < speech/sidecars/kokoro/VERSION)
          gh release download "kokoro-${SIDE_VERSION}" --pattern catalog.json --dir "$RUNNER_TEMP/speech" --repo "$GITHUB_REPOSITORY"
          CATALOG_BASE64=$(base64 < "$RUNNER_TEMP/speech/catalog.json" | tr -d '\n')
          echo "CATALOG_BASE64=$CATALOG_BASE64" >> "$GITHUB_ENV"

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
            -ldflags "-s -w -X github.com/wirvii/mneme/internal/cli.Version=${{ steps.version.outputs.VERSION }} -X github.com/wirvii/mneme/internal/speech.ManagedCatalogBase64=${CATALOG_BASE64}" \
            -o mneme ./cmd/mneme

      - name: Create archive
        run: |
          ARCHIVE="mneme-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "${ARCHIVE}" mneme
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Generate checksum
        run: |
          if [[ "${{ matrix.goos }}" == "linux" ]]; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            mneme-*.tar.gz
            mneme-*.tar.gz.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${GITHUB_REF_NAME}")
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${GITHUB_REF_NAME}")
          fi
          echo "$CHANGELOG" > changelog.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "mneme ${{ github.ref_name }}" \
            --notes-file changelog.txt \
            mneme-*.tar.gz \
            mneme-*.tar.gz.sha256
